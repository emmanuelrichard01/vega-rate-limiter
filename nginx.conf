events {
  worker_connections 1024;
}

http {
  upstream rate_limiter_cluster {
    # round-robin across replicas -- either one can answer any request,
    # since correctness comes from shared Redis state, not sticky routing.
    server api1:3000;
    server api2:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://rate_limiter_cluster;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }
  }
}
