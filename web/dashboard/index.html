<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rate Limiter — Client Usage Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: #666; margin-bottom: 24px; font-size: 0.9rem; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  select, input { padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem; }
  button { padding: 6px 14px; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; font-size: 0.9rem; }
  button:hover { background: #1d4ed8; }
  .stats { display: flex; gap: 16px; margin: 20px 0; flex-wrap: wrap; }
  .stat-card { background: #f5f6f8; border-radius: 10px; padding: 14px 18px; min-width: 140px; }
  .stat-card .label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-card .value { font-size: 1.5rem; font-weight: 600; margin-top: 4px; }
  canvas { max-height: 320px; }
  .error { color: #b91c1c; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Client Usage Dashboard</h1>
  <div class="sub">Real-time approved/denied traffic and latency, pulled from the rate limiter's async analytics pipeline.</div>

  <div class="controls">
    <label>API Key:
      <input type="password" id="apiKeyInput" value="my-secret-key-123" />
    </label>
    <label>Client:
      <select id="clientSelect"></select>
    </label>
    <label>Range:
      <select id="rangeSelect">
        <option value="10">Last 10 days</option>
        <option value="15">Last 15 days</option>
        <option value="30">Last 30 days</option>
      </select>
    </label>
    <button id="refreshBtn">Refresh</button>
  </div>

  <div id="errorBox" class="error"></div>

  <div class="stats" id="statsBox"></div>

  <canvas id="trendChart"></canvas>

  <script>
    const API_BASE = '';
    let chart;

    async function loadClients() {
      const apiKey = document.getElementById('apiKeyInput').value;
      const res = await fetch(`${API_BASE}/v1/clients`, {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });
      if (!res.ok) {
        document.getElementById('errorBox').textContent = `Failed to load clients: ${res.status}`;
        return;
      }
      const clients = await res.json();
      const sel = document.getElementById('clientSelect');
      sel.innerHTML = clients.map(c => `<option value="${c.clientId}">${c.clientId}</option>`).join('');
    }

    async function loadUsage() {
      const clientId = document.getElementById('clientSelect').value;
      const days = document.getElementById('rangeSelect').value;
      const errorBox = document.getElementById('errorBox');
      errorBox.textContent = '';
      if (!clientId) return;

      try {
        const apiKey = document.getElementById('apiKeyInput').value;
        const res = await fetch(`${API_BASE}/v1/usage/${encodeURIComponent(clientId)}?days=${days}`, {
          headers: { 'Authorization': `Bearer ${apiKey}` }
        });
        if (!res.ok) throw new Error(`API returned ${res.status}`);
        const data = await res.json();
        renderStats(data);
        renderChart(data);
      } catch (err) {
        errorBox.textContent = `Failed to load usage: ${err.message}`;
      }
    }

    function renderStats(data) {
      const { totals } = data;
      const denyRate = totals.totalRequests > 0
        ? ((totals.denied / totals.totalRequests) * 100).toFixed(1)
        : '0.0';
      document.getElementById('statsBox').innerHTML = `
        <div class="stat-card"><div class="label">Total Requests</div><div class="value">${totals.totalRequests.toLocaleString()}</div></div>
        <div class="stat-card"><div class="label">Allowed</div><div class="value">${totals.allowed.toLocaleString()}</div></div>
        <div class="stat-card"><div class="label">Denied (429)</div><div class="value">${totals.denied.toLocaleString()}</div></div>
        <div class="stat-card"><div class="label">Deny Rate</div><div class="value">${denyRate}%</div></div>
      `;
    }

    function renderChart(data) {
      const ctx = document.getElementById('trendChart');
      const labels = data.dailyTrend.map(d => new Date(d.day).toLocaleDateString());
      const allowed = data.dailyTrend.map(d => d.allowed);
      const denied = data.dailyTrend.map(d => d.denied);
      const latency = data.dailyTrend.map(d => d.avgLatencyMs);

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Allowed', data: allowed, backgroundColor: '#22c55e', yAxisID: 'y' },
            { label: 'Denied', data: denied, backgroundColor: '#ef4444', yAxisID: 'y' },
            { label: 'Avg latency (ms)', data: latency, type: 'line', borderColor: '#2563eb', backgroundColor: '#2563eb', yAxisID: 'y1', tension: 0.3 },
          ],
        },
        options: {
          responsive: true,
          scales: {
            y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Requests' } },
            y1: { position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, title: { display: true, text: 'ms' } },
          },
        },
      });
    }

    document.getElementById('refreshBtn').addEventListener('click', loadUsage);
    document.getElementById('clientSelect').addEventListener('change', loadUsage);
    document.getElementById('rangeSelect').addEventListener('change', loadUsage);

    loadClients().then(loadUsage);
  </script>
</body>
</html>
